<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MesaClick | Formulario</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado-principal">
    <a href="index.html" class="marca">MesaClick</a>
    <nav aria-label="Navegación principal">
      <ul id="menu-navegacion">
        <li><a href="index.html" class="enlace-nav">Inicio</a></li>
        <li><a href="formulario.html" class="enlace-nav activo">Reservar mesa</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor">
    <!-- Estructura base del formulario -->
    <section class="tarjeta">
      <h1>Formulario de reserva</h1>
      <form id="formulario-reserva" action="#" method="post">
        <div class="grupo-campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
        </div>

        <div class="grupo-campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha">
        </div>

        <button type="submit" class="boton-principal">Enviar</button>
      </form>
    </section>
  </main>

  <footer id="pie-pagina">
    <p>&copy; 2026 MesaClick — <a href="index.html" class="enlace-nav">Volver al inicio</a></p>
  </footer>
</body>
</html>
